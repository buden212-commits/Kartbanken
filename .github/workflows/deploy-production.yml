# Produktiondeploy till Vercel vid push till main.
# Kräver GitHub Actions secret: VERCEL_TOKEN
# (skapa på https://vercel.com/account/tokens)

name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@58

      - name: Pull Vercel env
        run: |
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: team_J2VydqEorjsej7SOxPWtHuye
          VERCEL_PROJECT_ID: prj_f03DNVqquNIX56SCbFl7h4pszJ1C

      - name: Build
        run: |
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: team_J2VydqEorjsej7SOxPWtHuye
          VERCEL_PROJECT_ID: prj_f03DNVqquNIX56SCbFl7h4pszJ1C

      - name: Deploy prebuilt
        run: |
          vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: team_J2VydqEorjsej7SOxPWtHuye
          VERCEL_PROJECT_ID: prj_f03DNVqquNIX56SCbFl7h4pszJ1C
